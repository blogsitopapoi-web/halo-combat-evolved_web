name: Build OpenCE single-thread experiment

on:
  workflow_dispatch:
  push:
    branches:
      - blogger-native-test
    paths:
      - 'tools/prepare_blogger_singlethread.py'
      - '.github/workflows/build-blogger-singlethread.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out this web-build repository
        uses: actions/checkout@v4

      - name: Check out the matching OpenCE source
        uses: actions/checkout@v4
        with:
          repository: OpenCommunityEdition/OpenCE
          ref: 8102e711c353068d22d62efe6bf67ebc8a90a22e
          path: opence-source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10
          actions-cache-folder: 'emsdk-cache'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkg-config

      - name: Patch the source for the non-threaded experiment
        run: python tools/prepare_blogger_singlethread.py opence-source

      - name: Configure and build OpenCE web
        working-directory: opence-source
        run: |
          python configure.py --release
          ninja web

      - name: Check generated JavaScript syntax
        run: node --check opence-source/build/web/site/app.js

      - name: Upload generated game site
        uses: actions/upload-artifact@v4
        with:
          name: opence-blogger-singlethread-web-experiment
          path: opence-source/build/web/site/
          if-no-files-found: error
          retention-days: 14
